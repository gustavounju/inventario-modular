spring.application.name=Inventario Modular
spring.profiles.default=local
inventario.version=${INVENTARIO_VERSION:0.0.1-SNAPSHOT}
inventario.local-auth.enabled=${INVENTARIO_LOCAL_AUTH_ENABLED:false}
inventario.local-db-auth.enabled=${INVENTARIO_LOCAL_DB_AUTH_ENABLED:false}
inventario.security.network.lan-only=${INVENTARIO_LAN_ONLY:true}
inventario.security.login.max-failures=${INVENTARIO_LOGIN_MAX_FAILURES:5}
inventario.security.login.block-seconds=${INVENTARIO_LOGIN_BLOCK_SECONDS:300}
inventario.movil.apk-path=${INVENTARIO_MOVIL_APK_PATH:output/android/tecnico-taller-san-pedro-lan-release.apk}
inventario.movil.apk-version=${INVENTARIO_MOVIL_APK_VERSION:0.1.10-lan}
spring.flyway.enabled=${INVENTARIO_FLYWAY_ENABLED:true}
spring.flyway.validate-on-migrate=${INVENTARIO_FLYWAY_VALIDATE:true}
spring.jpa.hibernate.ddl-auto=${INVENTARIO_JPA_DDL_AUTO:validate}
