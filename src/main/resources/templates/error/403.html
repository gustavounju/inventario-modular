<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Acceso no autorizado | Inventario Modular</title>
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
	<main class="shell">
		<section class="status-panel login-panel" aria-labelledby="error-title">
			<p class="eyebrow">Inventario Modular</p>
			<h1 id="error-title">Acceso no autorizado</h1>
			<p class="login-intro">
				La sesión no tiene permiso para esta acción o el acceso no viene desde la red interna permitida.
			</p>
			<div class="script-copy-panel">
				<a class="primary-action" th:href="@{/admin}">Volver al panel</a>
				<a class="secondary-action" th:href="@{/movil/login}">Ingresar de nuevo</a>
			</div>
		</section>
	</main>
</body>
</html>
