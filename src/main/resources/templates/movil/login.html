<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar a tareas | Centro Judicial San Pedro</title>
    <link rel="stylesheet" th:href="@{/css/movil.css}">
</head>
<body class="login-page">
    <main class="mobile-login">
        <p class="brand">Centro Judicial San Pedro</p>
        <h1>Tareas</h1>
        <p class="muted">Taller Informatica · Inventario Modular</p>
        <p class="message error" th:if="${param.error != null}" role="alert">Usuario o clave incorrectos.</p>
        <p class="message error" th:if="${param.bloqueado != null}" role="alert">Demasiados intentos fallidos. Espere unos minutos antes de volver a ingresar.</p>
        <form th:action="@{/login}" method="post">
            <input type="hidden" name="destino" value="movil">
            <label>Usuario local o de dominio<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
            <label>Clave<input name="password" type="password" autocomplete="current-password" required></label>
            <button class="primary" type="submit">Ingresar</button>
        </form>
    </main>
</body>
</html>
